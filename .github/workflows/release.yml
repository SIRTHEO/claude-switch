name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # gh CLI's `pr merge --auto` reads repo metadata from a local git
      # working tree. Without this checkout the step fails with "fatal:
      # not a git repository", leaving the release PR open forever.
      - uses: actions/checkout@v6
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # PAT (not GITHUB_TOKEN): pushes by GITHUB_TOKEN don't trigger
          # downstream workflows, so ci.yml would never run on the
          # release-please branch and the PR would never get required
          # checks → auto-merge would BLOCK forever. The PAT push
          # behaves like a human push and re-triggers ci.yml.
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please PRs are opened by GITHUB_TOKEN, which means
      # pull_request events never fire and required checks never run.
      # ci.yml now triggers on push to release-please--** branches so
      # the check runs are associated with the PR head SHA. This step
      # arms auto-merge so the PR merges automatically once all checks
      # pass — no manual --admin required.
      #
      # IMPORTANT: uses RELEASE_TOKEN (a PAT), NOT GITHUB_TOKEN.
      # Pushes by GITHUB_TOKEN do NOT trigger further workflow runs
      # (anti-loop), so an auto-merge done with GITHUB_TOKEN would
      # silently skip the subsequent release.yml run that tags + ships
      # to npm. The PAT push behaves like a human push and re-triggers.
      #
      # Prerequisite (one-time): enable "Allow auto-merge" in
      # GitHub → Settings → General, and store the PAT (repo + workflow
      # scopes) as repo secret RELEASE_TOKEN.
      - name: Enable auto-merge on release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          PR=$(gh pr list \
            --head 'release-please--branches--main--components--claude-switch' \
            --state open \
            --json number \
            --jq '.[0].number')
          if [ -n "$PR" ] && [ "$PR" != "null" ]; then
            gh pr merge --auto --merge "$PR" \
              || echo "::warning::auto-merge not available — merge PR #$PR manually once CI passes"
          fi

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # fetch-depth: 0 — the minsafe step below scans commit bodies since the
      # previous release tag for the `Bumps-Min-Safe: true` opt-in footer, so
      # it needs full history + tags (the default shallow clone has neither).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
        env:
          CLAUDE_SWITCH_TESTING: '1'
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `npm publish` triggers the `prepublishOnly` hook, which runs
          # `npm test`. Without this var the disable-keychain banner
          # fires and the warnUntrackedApiKey assertion regresses.
          CLAUDE_SWITCH_DISABLE_KEYCHAIN: '1'
          CLAUDE_SWITCH_TESTING: '1'
      - name: Deprecate older versions
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm deprecate "@sirtheo/claude-switch@<${VERSION}" \
            "Please upgrade: npm install -g @sirtheo/claude-switch — ${VERSION} is the latest stable release." || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The `minsafe` dist-tag marks the lowest SAFE version: any version below
      # it carries a known security/data-loss bug, and the client escalates the
      # update notice to a loud banner (see src/setup/update-check.ts). Only
      # bump it when a commit in THIS release explicitly opts in with a
      # `Bumps-Min-Safe: true` footer — auto-classifying from commit type is too
      # coarse (a plain `fix:` can be data-loss; most aren't). Best-effort: a
      # tag failure warns but never fails an already-published release.
      - name: Tag minsafe on security/data-loss releases
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Previous release tag (newest semver tag that isn't this release),
          # so we scan only the commits introduced by this release.
          PREV_TAG=$(git tag --sort=-v:refname \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vxF "v${VERSION}" | grep -vxF "${VERSION}" | head -1)
          RANGE="${PREV_TAG:+${PREV_TAG}..}HEAD"
          echo "Scanning ${RANGE} for the Bumps-Min-Safe opt-in footer"
          if git log ${RANGE} --format='%B' | grep -qiE '^Bumps-Min-Safe:[[:space:]]*true[[:space:]]*$'; then
            echo "Security/data-loss release — setting minsafe → ${VERSION}"
            npm dist-tag add "@sirtheo/claude-switch@${VERSION}" minsafe \
              || echo "::warning::failed to set minsafe dist-tag — set it manually: npm dist-tag add @sirtheo/claude-switch@${VERSION} minsafe"
          else
            echo "Routine release — minsafe dist-tag unchanged"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
