<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="ui-sans-serif, -apple-system, 'SF Pro Display', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="switchGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="200" fill="#0d1117" rx="24"/>

  <!-- ambient halo behind wordmark -->
  <ellipse cx="360" cy="100" rx="320" ry="80" fill="url(#halo)"/>

  <!-- wordmark, centered -->
  <g filter="url(#softglow)">
    <text x="360" y="128" text-anchor="middle" font-size="84" font-weight="800" letter-spacing="-3.5" fill="#fafaf9">claude<tspan fill="#52525b" font-weight="400" dx="-2" dy="-6">-</tspan><tspan fill="url(#switchGrad)" dx="-2">switch</tspan></text>
  </g>
</svg>
