name: Node.js CI

on:
  push:
    branches:
      - main
      # release-please PRs are created by GITHUB_TOKEN, which does NOT
      # trigger pull_request events (GitHub security model). Running CI on
      # the push to the release-please branch lets branch protection see
      # the required check runs on the PR head SHA, unblocking auto-merge.
      - 'release-please--**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      # See every platform/node combination on a failure rather than
      # cancelling siblings on the first red. Cost is small (9 jobs ~1min
      # each) and we lost a Windows-only regression once because Linux
      # failed first and masked it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Single canonical runner audits — avoids 9 racing reports across
      # the matrix. `--audit-level=high` blocks on HIGH/CRITICAL only;
      # MEDIUM/LOW noise is left to Dependabot to surface as PRs instead
      # of failing the build.
      - name: Audit dependencies (high+critical only)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm audit --audit-level=high --omit=dev

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test (Unix)
        if: runner.os != 'Windows'
        env:
          # Tests share a tmp dir per case but the macOS Keychain is
          # process-global. Disable the Keychain backend so suites that
          # reuse common email fixtures (a@b.com, etc.) don't leak keys
          # across files. Real-Keychain coverage lives in the dedicated
          # apikey-keychain.test.ts which opts back in via this env var.
          CLAUDE_SWITCH_DISABLE_KEYCHAIN: '1'
        # Two-segment glob lists root-level + one-deep test files. We
        # don't enable globstar/`**` to keep behaviour identical across
        # shells. Add another segment if the test tree grows deeper.
        run: node --test dist/test/*.test.js dist/test/*/*.test.js

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CLAUDE_SWITCH_DISABLE_KEYCHAIN: '1'
        run: |
          $files = Get-ChildItem -Path dist/test -Recurse -Filter "*.test.js" | ForEach-Object { $_.FullName }
          node --test @files

      # Coverage report posted to the job summary AND gated against a
      # floor on a single canonical runner (ubuntu + LTS node). Avoids 9
      # racing reports across the matrix. The floor is intentionally set
      # ~2pp below today's measured coverage so accidental regressions
      # turn red but the gate never blocks a no-op release. Ratchet up
      # manually as coverage genuinely improves — never lower it without
      # a clear deletion of dead code that justifies it.
      - name: Coverage report + threshold gate
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        env:
          CLAUDE_SWITCH_DISABLE_KEYCHAIN: '1'
          COVERAGE_FLOOR: '62'
        run: |
          set -o pipefail
          REPORT=$(node --test \
            --experimental-test-coverage \
            --test-coverage-include='dist/src/**/*.js' \
            dist/test/*.test.js dist/test/*/*.test.js 2>&1 \
            | sed -n '/start of coverage report/,/end of coverage report/p')

          # Append the human-readable report to the GitHub job summary
          # regardless of pass/fail — failure mode is "still see the
          # numbers, plus a red gate".
          {
            echo "## Coverage report"
            echo ""
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Extract the line-coverage % for `all files` (column 2 of the
          # pipe-delimited summary row). awk strips the leading whitespace.
          LINE_PCT=$(echo "$REPORT" \
            | grep -E "all files" \
            | awk -F'|' '{ gsub(/[ ]/, "", $2); print $2 }')

          if [ -z "$LINE_PCT" ]; then
            echo "::error::could not parse line coverage from report"
            exit 1
          fi

          echo "Line coverage: ${LINE_PCT}%  (floor: ${COVERAGE_FLOOR}%)"

          # awk-based comparison so we don't need bc/python on the runner.
          if awk -v cov="$LINE_PCT" -v floor="$COVERAGE_FLOOR" \
                 'BEGIN { exit (cov + 0 < floor + 0) ? 0 : 1 }'; then
            echo "::error::coverage ${LINE_PCT}% is below the ${COVERAGE_FLOOR}% floor"
            exit 1
          fi
