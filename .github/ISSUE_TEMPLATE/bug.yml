name: 🐛 Bug report
description: Something is broken or behaving unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Before filing: a quick search of [existing issues](https://github.com/SIRTHEO/claude-switch/issues?q=is%3Aissue) often turns up an answer in seconds.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A short description of the bug — what you expected vs what you got.
      placeholder: |
        I ran `claude switch …` and …
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered list. Ideally the smallest sequence that triggers it.
      placeholder: |
        1. `claude switch add` …
        2. …
        3. Observe …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: claude-switch version
      description: Output of `claude switch --version`
      placeholder: e.g. 3.5.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: e.g. v22.10.0

  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of (real) `claude --version`. Run `cat ~/.claude/accounts/.claude-bin` then invoke that path with `--version` if `claude` is shadowed by claude-switch.

  - type: textarea
    id: logs
    attributes:
      label: Logs / proxy debug output
      description: |
        For fallback / proxy bugs, please re-run with `CLAUDE_SWITCH_PROXY_DEBUG=1`
        and paste the relevant lines here. Sanitize tokens / emails before posting.
      render: shell
