name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      # See every platform/node combination on a failure rather than
      # cancelling siblings on the first red. Cost is small (9 jobs ~1min
      # each) and we lost a Windows-only regression once because Linux
      # failed first and masked it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: node --test dist/test/*.test.js

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist/test -Filter "*.test.js" | ForEach-Object { $_.FullName }
          node --test @files

      # Coverage report posted to the job summary on a single canonical runner
      # (ubuntu + LTS node). Avoids 9 racing reports across the matrix.
      - name: Coverage report (job summary)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: |
          set -o pipefail
          REPORT=$(node --test \
            --experimental-test-coverage \
            --test-coverage-include='dist/src/**/*.js' \
            dist/test/*.test.js 2>&1 \
            | sed -n '/start of coverage report/,/end of coverage report/p')
          {
            echo "## Coverage report"
            echo ""
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
