name: Dependabot auto-merge

# Dependabot's grouped minor/patch bumps pass CI but then sit open until merged
# by hand, piling up. Auto-enable merge for patch + minor once the required
# checks pass (branch protection still gates the actual merge). MAJOR bumps are
# left for manual review — they're the ones likely to need code changes — which
# mirrors the major-vs-minor split already configured in .github/dependabot.yml.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # For a grouped PR the reported update-type is the highest bump in the
      # group; our npm group is minor+patch only, so this stays out of major.
      - name: Enable auto-merge for patch & minor
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
